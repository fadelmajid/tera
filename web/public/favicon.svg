<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tera">
  <title>Tera</title>
  <!-- A balance scale: "tera" is the legal calibration stamp struck on a
       weighing instrument. This system exists so a family can settle money on
       a margin figure, which is the same promise.
       Four shapes and nothing else — a browser tab renders this at 16px, where
       hangers and a pivot knob turn into grey mush. Keep it in step with
       web/src/components/Logo.tsx, which draws the same mark. -->
  <rect width="64" height="64" rx="14" fill="#1a7a4a" stroke="none"/>
  <g fill="#ffffff" stroke="none">
    <rect x="29.25" y="16" width="5.5" height="30" rx="2.75"/>
    <rect x="15" y="20" width="34" height="5.5" rx="2.75"/>
    <path d="M9 29h16l-8 9z"/>
    <path d="M39 29h16l-8 9z"/>
    <rect x="20" y="43.5" width="24" height="5.5" rx="2.75"/>
  </g>
</svg>
