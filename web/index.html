<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b101b" />
    <!-- The mark is an SVG so one file covers every size the browser asks for;
         the PNG is only for an iOS home screen, which will not take the SVG.
         Both ship inside the binary like the rest of the client. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Tera — sistem persediaan dan penjualan." />
    <title>Tera</title>
  </head>
