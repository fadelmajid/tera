[program:tera]
command=/home/workspace/Project/tera/deploy/zo/start.sh
directory=/home/workspace/Project/tera
environment=TERA_ADDR="0.0.0.0:8080"
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
startretries=20
startsecs=5
stdout_logfile=/dev/shm/tera.log
stderr_logfile=/dev/shm/tera_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
killasgroup=true
stopwaitsecs=4
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
