name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file pins to go.mod, so CI holds the floor the project
      # claims (Go 1.23) rather than whatever the runner ships with.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Build the front end first: the binary embeds it, and the SPA-serving
      # tests should exercise what actually ships rather than the fallback.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build web
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race needs cgo; the shipped binary is still built CGO_ENABLED=0.
      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Enforces the layering rule and the no-float rule as well as style —
      # see the depguard and forbidigo blocks in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  # Regenerating sqlc must produce no diff — generated code stays in step with
  # the queries. Enabled once queries exist (TASKS 0.4).
